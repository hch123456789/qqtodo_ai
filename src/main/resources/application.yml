server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/qq_todo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

file:
  storage-path: ./files

ai:
  api-url: ${AI_API_URL:https://api.deepseek.com/chat/completions}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-chat}

qq:
  http-api-url: http://127.0.0.1:3000
  self-id: ${QQ_SELF_ID:}
  reminder-hours: 5
  event-token: ${QQ_EVENT_TOKEN:}

vision:
  api-url: ${VISION_API_URL:}
  api-key: ${VISION_API_KEY}
  model: ${VISION_MODEL}
